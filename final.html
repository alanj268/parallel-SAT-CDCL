<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15-418 CDCL SAT Solver – Final Report</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #334155;
      --accent: #0369a1;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    h1, h2, h3 { line-height: 1.25; }
    h1 { margin-top: 0; font-size: 1.9rem; }
    h2 {
      margin: 0 0 0.75rem;
      font-size: 1.2rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    p { margin: 0.5rem 0; }
    .meta {
      color: var(--muted);
      margin-top: 0.35rem;
    }
    a { color: var(--accent); }
    .nav-link {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: #ffffff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .pdf-frame {
      width: 100%;
      height: 85vh;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
    }
    .fallback {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="container">
    <a href="index.html" class="nav-link">← Back to Proposal</a>

    <section class="card">
      <h1>Final Report</h1>
      <p><strong>Team Members:</strong> Alan Joseph (alanjose), Om Arora (oarora)</p>
      <p><strong>Course:</strong> 15-418 - Parallel Computer Architecture and Programming, Spring 2026</p>
      <p class="meta">Final report PDF embedded below.</p>
    </section>

    <section class="card">
      <iframe class="pdf-frame" src="final_report.pdf" title="Final Report PDF"></iframe>
      <div class="fallback">
        If the PDF does not display in your browser, open it directly <a href="final_report.pdf">here</a>.
      </div>
    </section>
  </main>
</body>
</html>
